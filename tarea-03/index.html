<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="tarea-02.css">
    <title>Facebook</title>
    <script type="module" src="/src/main.js"></script>
</head>
<body>
    <div class="fondo">
        <div class="flex">
            <div class="encabezado">
                <div class="logo">
                    <img class="logo_image" src="https://static.xx.fbcdn.net/rsrc.php/y1/r/4lCu2zih0ca.svg" alt="Facebook">
                </div>
                <h2 class="texto">
                    Facebook te ayuda a comunicarte y compartir con las personas que forman parte de tu vida.
                </h2>
            </div>
            <div class="borde">
                <div class="formulario_centro">
                    <div class="formulario">
                        <form class="form">
                            <label for="name">Ingrese su correo</label>
                            <input type="name">
                            <br>
                            <label for="password">Ingrese su contraseña</label>
                            <input type="password">
                        </form>
                        <button class="boton">Iniciar Sesión</button>
                    </div>

                </div>

            </div>
            
        </div>
    </div>
</body>
</html>
